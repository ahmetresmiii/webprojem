<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-E POYRAZ ALARMI!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { cursor: pointer; user-select: none; background: #000; overflow: hidden; }
        .danger-pulse { animation: pulse 0.3s infinite; }
        @keyframes pulse { 0% { background: #f00; } 50% { background: #400; } 100% { background: #f00; } }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans" onclick="runWarning()">

    <div class="bg-yellow-400 border-[10px] border-black p-8 max-w-sm text-center shadow-[10px_10px_0px_#f00]">
        <h1 class="text-6xl font-black mb-2 italic">DİKKAT!</h1>
        <p class="text-xl font-bold bg-black text-white p-2 mb-4">8-E POYRAZ GÖRÜLDÜ</p>
        <p class="text-black font-black text-lg mb-6 uppercase">
            YENİ 5. SINIFLAR: <br> GAZ MASKESİ TAKIN!
        </p>
        <div class="danger-pulse text-white font-black py-4 border-4 border-black text-2xl uppercase">TIKLA VE DUY!</div>
    </div>

    <div id="overlay">
        <video id="vid" class="w-full max-w-[315px] h-auto border-4 border-yellow-400" playsinline preload="auto">
            <source src="poyraz.mp4" type="video/mp4">
        </video>
        <button onclick="stopAll(event)" class="mt-8 bg-white text-black px-12 py-4 font-black text-2xl border-4 border-black active:bg-red-600">KAÇ!</button>
    </div>

    <footer class="fixed bottom-4 text-white font-black text-lg bg-red-600 px-6 py-1 border-2 border-white uppercase">
        YAPIMCI: ATEŞ VİDİNLİ
    </footer>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playFart() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = ['sawtooth', 'square'][Math.floor(Math.random() * 2)];
            const f = Math.random() * 100 + 40;
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function runWarning() {
            playFart();
            const v = document.getElementById('vid');
            document.getElementById('overlay').style.display = 'flex';
            v.currentTime = 0;
            const playPromise = v.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    console.log("Oynatma hatası: poyraz.mp4 dosyası eksik veya format hatalı.");
                });
            }
        }

        function stopAll(e) {
            e.stopPropagation();
            const v = document.getElementById('vid');
            v.pause();
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
